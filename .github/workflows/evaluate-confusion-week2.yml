name: DARPA Week 2 - Stage 3 confusion coverage evaluation
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/anomaly_detection/evaluate_confusion_week2.py'
      - 'tests/test_evaluate_confusion_week2.py'
      - 'docs/ETAPA_3_CONFUSION.md'
      - 'src/anomaly_detection/cli.py'
      - 'data/ground_truth/week2_intervals_review.csv'
      - '.github/workflows/evaluate-confusion-week2.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Evaluate Week 2 alarm coverage
        run: darpa-anomaly evaluate-confusion-week2
      - uses: actions/upload-artifact@v4
        with:
          name: darpa-week2-stage3-confusion-audit
          path: results/stage3-confusion/
          if-no-files-found: error
